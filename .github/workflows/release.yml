name: Release

on:
  # Obsidian's convention is a plain version tag with no "v" prefix, matching the
  # version in manifest.json.
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  # Lets a release be cut from the Actions tab without touching git locally:
  # the tag is created here if it does not exist yet.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (defaults to the one in manifest.json)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION=$(node -p "require('./manifest.json').version")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PLUGIN_ID=$(node -p "require('./manifest.json').id")" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        run: |
          rm -rf "$PLUGIN_ID"
          mkdir -p "$PLUGIN_ID"
          cp main.js manifest.json "$PLUGIN_ID/"
          zip -r "$PLUGIN_ID.zip" "$PLUGIN_ID"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "$VERSION" 2>/dev/null || true
          git push origin "refs/tags/$VERSION" 2>/dev/null || true

          # Re-runnable: create the release if it is new, otherwise refresh assets.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" main.js manifest.json "$PLUGIN_ID.zip" --clobber
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              main.js manifest.json "$PLUGIN_ID.zip"
          fi
